<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183922">
  <title>크레허브 분양 데이터</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#20241f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 18px 48px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;color:#183922;margin:4px 0 18px}.brand-dot{width:32px;height:32px;border-radius:11px;background:#183922;color:#f2d989;display:grid;place-items:center}.card{background:#fff;border:1px solid #00000010;border-radius:24px;padding:22px;box-shadow:0 10px 30px #00000008}.hero h1{font-size:25px;line-height:1.28;margin:0 0 10px}.hero p{margin:0;color:#646a62;line-height:1.65}.choice{display:grid;gap:10px;margin-top:20px}.btn{appearance:none;border:0;border-radius:15px;min-height:54px;padding:15px 18px;font-size:15px;font-weight:850;text-decoration:none;text-align:center;cursor:pointer}.primary{background:#183922;color:#fff}.secondary{background:#eef3e8;color:#183922;border:1px solid #18392218}.play{background:#fff6df;color:#5d4710;border:1px solid #ead79a}.hint{margin-top:13px;font-size:12px;color:#7b8079;line-height:1.55}.preview{display:none;margin-top:16px}.preview.show{display:block}.cover{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:20px;background:#edf0e8}.name{font-size:28px;font-weight:950;margin:18px 0 6px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 18px}.chip{background:#eef3e8;color:#27462e;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:750}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{background:#f7f7f2;border-radius:15px;padding:13px}.eyebrow{font-size:11px;color:#858a82;margin-bottom:4px}.info strong{font-size:14px}.parents{display:grid;gap:10px;margin-top:12px}.parent-card{display:flex;gap:12px;align-items:center;background:#f7f7f2;border-radius:16px;padding:11px}.parent-card img,.parent-placeholder{width:58px;height:58px;border-radius:13px;object-fit:cover;background:#e8eadf;display:grid;place-items:center}.muted{font-size:12px;color:#747a72;margin-top:4px;line-height:1.45}.cta{margin-top:16px;background:#183922;color:#fff;border-radius:23px;padding:22px}.cta h2{font-size:19px;margin:0 0 8px}.cta p{font-size:13px;line-height:1.62;color:#dce6dc;margin:0 0 16px}.expired{text-align:center;padding:38px 22px}.expired .icon{font-size:44px}.small{font-size:11px;color:#8a8f87;margin-top:15px;line-height:1.5}.loading{text-align:center;padding:42px 20px}.spinner{width:34px;height:34px;border:4px solid #dce4da;border-top-color:#183922;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:540px){.choice{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="brand-dot">🦎</div>CreHub · 크레허브</div>
  <div id="app"><div class="card loading"><div class="spinner"></div><strong>분양 데이터를 불러오고 있어요</strong></div></div>
</div>
<script>
const DATA_URL='https://fumjiligxivbfhhhcjcu.supabase.co/functions/v1/crehub-transfer-data';
const STORE_URL='https://play.google.com/store/apps/details?id=com.crehub.gecko';
const params=new URLSearchParams(location.search);
const code=(params.get('code')||'').trim().toLowerCase();
const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeImg(v){try{const u=new URL(String(v||''));return u.protocol==='https:'?esc(u.toString()):'';}catch{return '';}}
function sex(v){v=String(v||'').toLowerCase();if(v==='male'||v==='수컷')return '수컷';if(v==='female'||v==='암컷')return '암컷';return '미확인';}
function date(v){const d=new Date(String(v||''));if(Number.isNaN(d.getTime()))return '-';return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function parentCard(label,p){if(!p||typeof p!=='object')return '';const img=safeImg(p.coverUrl);const morphs=Array.isArray(p.morphs)?p.morphs.map(esc).join(' · '):'';return `<div class="parent-card">${img?`<img src="${img}" alt="${esc(label)} 사진">`:'<div class="parent-placeholder">🦎</div>'}<div><div class="eyebrow">${esc(label)}</div><strong>${esc(p.name||label)}</strong><div class="muted">${esc(sex(p.sex))}${morphs?` · ${morphs}`:''}</div></div></div>`;}
function openApp(){let hidden=false;const onVis=()=>{if(document.hidden)hidden=true};document.addEventListener('visibilitychange',onVis,{once:true});location.href=`crestedgecko://transfer/${code}`;setTimeout(()=>{if(!hidden&&!document.hidden)location.href=STORE_URL},1400);}
function renderError(){app.innerHTML=`<div class="card expired"><div class="icon">⏰</div><h1>사용할 수 없는 분양 링크예요</h1><p class="muted">분양 링크가 만료되었거나 올바르지 않습니다. 보낸 분에게 새 링크를 요청해주세요.</p><a class="btn primary" style="display:block;margin-top:18px" href="${STORE_URL}">크레허브 알아보기</a></div>`;}
function render(data){const p=data.preview||{};const name=esc(p.name||'크레스티드게코');const cover=safeImg(p.coverUrl);const morphs=Array.isArray(p.morphs)?p.morphs.map(esc).filter(Boolean):[];const w=Number(p.weight);const parents=parentCard('부',p.father)+parentCard('모',p.mother);app.innerHTML=`<section class="card hero"><h1>${name}의 분양 데이터가 도착했어요</h1><p>어떻게 확인할까요? 웹에서 개체 정보를 먼저 볼 수도 있고, 크레허브 앱에서 바로 내 개체로 추가할 수도 있어요.</p><div class="choice"><button class="btn primary" id="openApp">앱에서 추가하기</button><button class="btn secondary" id="viewWeb">웹에서 보기</button></div><div class="hint">앱에 추가하면 <b>전달된 사진 · 체중 기록 · 혈통 정보</b>까지 이어서 확인할 수 있고, 이후 사육 기록도 계속 쌓아갈 수 있어요.</div></section><section class="card preview" id="preview">${cover?`<img class="cover" src="${cover}" alt="${name}">`:''}<div class="name">${name}</div><div class="chips">${morphs.length?morphs.map(m=>`<span class="chip">${m}</span>`).join(''):'<span class="chip">모프 정보 없음</span>'}</div><div class="grid"><div class="info"><div class="eyebrow">성별</div><strong>${esc(sex(p.sex))}</strong></div><div class="info"><div class="eyebrow">현재 체중</div><strong>${Number.isFinite(w)?`${String(Math.round(w*100)/100)} g`:'-'}</strong></div><div class="info"><div class="eyebrow">생일</div><strong>${esc(date(p.birthDate))}</strong></div><div class="info"><div class="eyebrow">브리더</div><strong>${esc(p.breeder||'-')}</strong></div></div>${parents?`<div class="parents">${parents}</div>`:''}<div class="small">웹에서는 분양 전 확인에 필요한 기본 정보만 보여드려요. 전체 사진과 기존 체중 기록 등 실제 전달 데이터는 크레허브에 추가한 뒤 확인할 수 있습니다.</div></section><section class="cta"><h2>기록까지 함께 이어받으세요</h2><p>단순히 개체 이름만 저장하는 게 아니에요. 크레허브에 추가하면 보내는 분이 함께 전달한 그동안의 사진, 체중 변화, 부모·혈통 정보를 확인하고 앞으로의 성장 기록까지 한곳에서 관리할 수 있어요.</p><button class="btn play" style="width:100%" id="openAppBottom">크레허브에서 이 개체 추가하기</button><a class="btn secondary" style="display:block;margin-top:9px;background:white" href="${STORE_URL}">Google Play에서 크레허브 받기</a></section>`;document.getElementById('openApp').onclick=openApp;document.getElementById('openAppBottom').onclick=openApp;document.getElementById('viewWeb').onclick=()=>{const el=document.getElementById('preview');el.classList.add('show');el.scrollIntoView({behavior:'smooth',block:'start'})};}
(async()=>{if(!/^[a-f0-9]{32}$/.test(code)){renderError();return;}try{const r=await fetch(`${DATA_URL}?code=${encodeURIComponent(code)}`,{cache:'no-store'});const data=await r.json();if(!r.ok||!data.ok){renderError();return;}render(data);}catch(e){app.innerHTML='<div class="card expired"><div class="icon">⚠️</div><h1>잠시 후 다시 시도해주세요</h1><p class="muted">분양 정보를 불러오지 못했습니다. 네트워크 상태를 확인해주세요.</p></div>';}})();
</script>
</body>
</html>
