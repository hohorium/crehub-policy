<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183922">
  <meta name="description" content="크레허브에서 공유한 크레스티드게코 개체 프로필">
  <title>크레허브 개체 자랑</title>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f5ef;color:#20241f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 16px 44px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;color:#183922;margin:3px 2px 18px}.brand-dot{width:34px;height:34px;border-radius:12px;background:#183922;color:#f2d989;display:grid;place-items:center}.card{background:#fff;border:1px solid #0000000d;border-radius:24px;box-shadow:0 10px 30px #00000008;overflow:hidden}.loading,.expired{text-align:center;padding:46px 22px}.spinner{width:34px;height:34px;border:4px solid #dce4da;border-top-color:#183922;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.gallery{position:relative;background:#e9ece5}.gallery-main{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.gallery-empty{aspect-ratio:1/1;display:grid;place-items:center;font-size:70px;color:#9ba49a;background:linear-gradient(145deg,#eef2e9,#e4e9df)}.thumbs{display:flex;gap:7px;padding:9px;background:#fff}.thumb{border:0;padding:0;background:#eef0e9;border-radius:11px;overflow:hidden;flex:0 0 62px;height:62px;cursor:pointer;outline:2px solid transparent}.thumb.active{outline-color:#183922}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:22px}.source{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#eef3e8;color:#315039;font-size:11px;font-weight:800}.name{font-size:30px;line-height:1.2;font-weight:950;margin:12px 0 8px;word-break:break-word}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}.chip{background:#eef3e8;color:#27462e;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:760}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.info{background:#f7f7f2;border-radius:16px;padding:14px;min-height:72px}.eyebrow{font-size:11px;color:#858a82;margin-bottom:5px}.info strong{font-size:14px;line-height:1.4}.section{margin-top:22px}.section h2{font-size:16px;margin:0 0 10px}.parents{display:grid;grid-template-columns:1fr 1fr;gap:10px}.parent{background:#f7f7f2;border-radius:17px;padding:11px;display:flex;gap:11px;align-items:center;min-width:0}.parent img,.parent-empty{width:64px;height:64px;border-radius:14px;object-fit:cover;background:#e7eae1;flex:0 0 64px}.parent-empty{display:grid;place-items:center;font-size:28px}.parent-meta{min-width:0}.parent strong{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{font-size:12px;color:#747a72;line-height:1.5}.weight-chart{background:#f7f7f2;border-radius:18px;padding:14px 12px 12px;overflow:hidden}.weight-chart-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:8px}.weight-chart-head strong{font-size:14px}.weight-chart-head .muted{text-align:right}.weight-svg{width:100%;height:auto;display:block;overflow:visible}.weight-grid{stroke:#dfe5db;stroke-width:1}.weight-axis{fill:#7c847a;font-size:10px}.weight-line{fill:none;stroke:#183922;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.weight-area{fill:#dfeadb;opacity:.55}.weight-dot{fill:#fff;stroke:#183922;stroke-width:2}.weight-dot.latest{fill:#183922}.weight-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.weight-stat{background:#fff;border-radius:12px;padding:9px 8px;text-align:center}.weight-stat span{display:block;font-size:10px;color:#858a82;margin-bottom:3px}.weight-stat strong{font-size:12px}.weight-single{background:#f7f7f2;border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center}.weight-single strong{font-size:16px}.cta{margin-top:16px;background:#183922;color:#fff;border-radius:24px;padding:22px}.cta h2{font-size:19px;margin:0 0 8px}.cta p{margin:0 0 16px;font-size:13px;line-height:1.6;color:#dce6dc}.btn{appearance:none;border:0;border-radius:15px;min-height:52px;padding:14px 17px;font-size:14px;font-weight:850;text-decoration:none;text-align:center;cursor:pointer;display:block;width:100%}.primary{background:#f2d989;color:#253117}.secondary{margin-top:9px;background:#fff;color:#183922}.small{font-size:11px;color:#858a82;line-height:1.55;margin-top:14px}.expired .icon{font-size:46px}.expired h1{font-size:22px}.photo-modal{position:fixed;inset:0;background:#000e;z-index:10;display:none;align-items:center;justify-content:center;padding:52px 14px 24px}.photo-modal.show{display:flex}.photo-modal img{max-width:100%;max-height:86vh;object-fit:contain}.photo-close{position:absolute;right:16px;top:14px;width:40px;height:40px;border:0;border-radius:50%;background:#ffffff22;color:white;font-size:25px;cursor:pointer}@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}.parents{grid-template-columns:1fr 1fr}.wrap{padding-top:28px}}@media(max-width:420px){.parents{grid-template-columns:1fr}.name{font-size:27px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="brand-dot">🦎</div>CreHub · 크레허브</div>
  <div id="app"><div class="card loading"><div class="spinner"></div><strong>개체 정보를 불러오고 있어요</strong></div></div>
</div>
<div class="photo-modal" id="photoModal"><button class="photo-close" aria-label="닫기">×</button><img id="modalImg" alt="개체 사진 크게 보기"></div>
<script>
const DATA_URL='https://fumjiligxivbfhhhcjcu.supabase.co/functions/v1/crehub-gecko-showcase-data';
const STORE_URL='https://play.google.com/store/apps/details?id=com.crehub.gecko';
const params=new URLSearchParams(location.search);const code=(params.get('code')||'').trim().toLowerCase();const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeImg(v){try{const u=new URL(String(v||''));return u.protocol==='https:'?esc(u.toString()):'';}catch{return '';}}
function sex(v){const s=String(v||'').toLowerCase();if(s==='male'||s==='수컷')return '수컷';if(s==='female'||s==='암컷')return '암컷';return '미구분';}
function date(v){if(!v)return '-';const d=new Date(String(v));if(Number.isNaN(d.getTime()))return '-';return new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}
function num(v){const n=Number(v);return Number.isFinite(n)?String(Math.round(n*100)/100):'-';}
function openApp(){let hidden=false;const onVis=()=>{if(document.hidden)hidden=true};document.addEventListener('visibilitychange',onVis,{once:true});location.href=`crestedgecko://showcase/${code}`;setTimeout(()=>{if(!hidden&&!document.hidden)location.href=STORE_URL},1400);}
function parentCard(label,p){if(!p||typeof p!=='object')return '';const img=safeImg(p.photo_url||p.photoUrl);const morphs=Array.isArray(p.morphs)?p.morphs.map(esc).filter(Boolean).join(' · '):'';return `<div class="parent">${img?`<img class="zoomable" src="${img}" alt="${esc(label)} 사진">`:'<div class="parent-empty">🦎</div>'}<div class="parent-meta"><div class="eyebrow">${esc(label)}</div><strong>${esc(p.name||'부모 개체')}</strong><div class="muted">${esc(sex(p.sex))}${morphs?`<br>${morphs}`:''}</div></div></div>`;}
function weightChart(raw){const rows=(Array.isArray(raw)?raw:[]).map((w,i)=>{const n=Number(w?.weight),d=new Date(String(w?.date||w?.measured_at||''));return Number.isFinite(n)&&!Number.isNaN(d.getTime())?{weight:n,date:d,time:d.getTime(),i}:null;}).filter(Boolean).sort((a,b)=>a.time-b.time||a.i-b.i);if(!rows.length)return '';if(rows.length===1){const r=rows[0];return `<div class="section"><h2>체중 변화</h2><div class="weight-single"><div><div class="eyebrow">체중 기록</div><span class="muted">${esc(date(r.date))}</span></div><strong>${num(r.weight)} g</strong></div></div>`;}const W=640,H=228,L=46,R=16,T=18,B=38,pw=W-L-R,ph=H-T-B;const values=rows.map(r=>r.weight),min=Math.min(...values),max=Math.max(...values),span=Math.max(max-min,.2),pad=Math.max(span*.18,.25),yMin=Math.max(0,min-pad),yMax=max+pad;const t0=rows[0].time,t1=rows[rows.length-1].time,td=Math.max(t1-t0,1);const x=r=>L+((r.time-t0)/td)*pw,y=r=>T+((yMax-r.weight)/(yMax-yMin))*ph;const pts=rows.map(r=>`${x(r).toFixed(1)},${y(r).toFixed(1)}`).join(' ');const area=`${L},${T+ph} ${pts} ${W-R},${T+ph}`;const grids=[0,.25,.5,.75,1].map(q=>{const yy=T+q*ph,v=yMax-q*(yMax-yMin);return `<line class="weight-grid" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}"/><text class="weight-axis" x="${L-7}" y="${(yy+3).toFixed(1)}" text-anchor="end">${num(v)}</text>`;}).join('');const labelRows=[rows[0],rows[Math.floor((rows.length-1)/2)],rows[rows.length-1]];const xLabels=labelRows.map((r,idx)=>`<text class="weight-axis" x="${x(r).toFixed(1)}" y="${H-8}" text-anchor="${idx===0?'start':idx===2?'end':'middle'}">${esc(new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit'}).format(r.date))}</text>`).join('');const dots=rows.map((r,i)=>`<circle class="weight-dot ${i===rows.length-1?'latest':''}" cx="${x(r).toFixed(1)}" cy="${y(r).toFixed(1)}" r="${i===rows.length-1?5:3.5}"><title>${esc(date(r.date))} · ${num(r.weight)} g</title></circle>`).join('');const first=rows[0],last=rows[rows.length-1],change=last.weight-first.weight,changeText=`${change>0?'+':''}${num(change)} g`;return `<div class="section"><h2>체중 변화</h2><div class="weight-chart"><div class="weight-chart-head"><strong>${rows.length}회 기록</strong><div class="muted">${esc(date(first.date))} ~ ${esc(date(last.date))}</div></div><svg class="weight-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="체중 변화 차트">${grids}<polygon class="weight-area" points="${area}"/><polyline class="weight-line" points="${pts}"/>${dots}${xLabels}</svg><div class="weight-summary"><div class="weight-stat"><span>시작</span><strong>${num(first.weight)} g</strong></div><div class="weight-stat"><span>최근</span><strong>${num(last.weight)} g</strong></div><div class="weight-stat"><span>변화</span><strong>${esc(changeText)}</strong></div></div></div></div>`;}
function renderError(expired=false){app.innerHTML=`<div class="card expired"><div class="icon">${expired?'⏰':'🔗'}</div><h1>${expired?'자랑 링크가 만료됐어요':'사용할 수 없는 자랑 링크예요'}</h1><p class="muted">${expired?'보낸 분이 링크를 다시 만들면 최신 개체 정보를 볼 수 있어요.':'공개가 해제되었거나 링크가 올바르지 않을 수 있어요.'}</p><a class="btn primary" style="margin-top:18px" href="${STORE_URL}">크레허브 알아보기</a></div>`;}
function renderTemporary(){app.innerHTML='<div class="card expired"><div class="icon">⚠️</div><h1>자랑 정보를 잠시 불러오지 못했어요</h1><p class="muted">네트워크 또는 서버 연결이 원활하지 않습니다. 잠시 후 새로고침해주세요.</p><button class="btn primary" style="margin-top:18px" onclick="location.reload()">다시 시도</button></div>';}
function bindZoom(){const modal=document.getElementById('photoModal'),modalImg=document.getElementById('modalImg');document.querySelectorAll('.zoomable').forEach(el=>el.addEventListener('click',()=>{modalImg.src=el.src;modal.classList.add('show')}));modal.querySelector('.photo-close').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};}
function render(data){const p=data.snapshot||{};const name=esc(p.name||'크레스티드게코');const morphs=Array.isArray(p.morphs)?p.morphs.map(esc).filter(Boolean):[];const photos=(Array.isArray(p.photos)?p.photos:[]).map(x=>safeImg(x?.url)).filter(Boolean).slice(0,3);const father=parentCard('아버지',p.father),mother=parentCard('어머니',p.mother);const rawWeights=Array.isArray(p.weights)?p.weights:[];const weightSection=weightChart(rawWeights);const source=esc(p.source_label||p.sourceLabel||'크레허브 개체');const cover=photos[0]||'';app.innerHTML=`<section class="card">${cover?`<div class="gallery"><img id="mainPhoto" class="gallery-main zoomable" src="${cover}" alt="${name} 사진">${photos.length>1?`<div class="thumbs">${photos.map((url,i)=>`<button class="thumb ${i===0?'active':''}" data-url="${url}"><img src="${url}" alt="사진 ${i+1}"></button>`).join('')}</div>`:''}</div>`:'<div class="gallery-empty">🦎</div>'}<div class="body"><span class="source">🦎 ${source}</span><div class="name">${name}</div><div class="chips">${morphs.length?morphs.map(m=>`<span class="chip">${m}</span>`).join(''):'<span class="chip">모프 정보 없음</span>'}</div><div class="grid"><div class="info"><div class="eyebrow">성별</div><strong>${esc(sex(p.sex))}</strong></div><div class="info"><div class="eyebrow">현재 체중</div><strong>${p.current_weight!=null?`${num(p.current_weight)} g`:'-'}</strong></div><div class="info"><div class="eyebrow">생일</div><strong>${esc(date(p.birth_date))}</strong></div><div class="info"><div class="eyebrow">브리더</div><strong>${esc(p.breeder||'-')}</strong></div></div>${father||mother?`<div class="section"><h2>부모 정보</h2><div class="parents">${father}${mother}</div></div>`:''}${weightSection}<div class="small">이 페이지는 크레허브 사용자가 외부에 자랑하기 위해 공유한 공개용 개체 정보입니다. 메모·관리 기록 등 비공개 데이터는 표시하지 않습니다.</div></div></section><section class="cta"><h2>이런 개체 기록, 크레허브에서 관리해보세요</h2><p>사진, 체중 변화, 부모·혈통 정보와 사육 기록을 한곳에서 관리하고 다른 크레 집사들과 공유할 수 있어요.</p><button class="btn primary" id="openApp">크레허브 앱에서 보기</button><a class="btn secondary" href="${STORE_URL}">Google Play에서 크레허브 받기</a></section>`;const main=document.getElementById('mainPhoto');document.querySelectorAll('.thumb').forEach(btn=>btn.onclick=()=>{if(main){main.src=btn.dataset.url||'';document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}});document.getElementById('openApp').onclick=openApp;bindZoom();document.title=`${p.name||'개체'} · 크레허브`;}
(async()=>{if(!/^[a-f0-9]{32}$/.test(code)){renderError(false);return;}try{const r=await fetch(`${DATA_URL}?code=${encodeURIComponent(code)}`,{cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok){if(r.status>=500){renderTemporary();return;}renderError(data.error==='expired');return;}render(data);}catch(e){renderTemporary();}})();
</script>
</body>
</html>
